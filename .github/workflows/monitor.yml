name: Anthropic News Monitor

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      recategorize:
        description: 'Re-apply category rules to all articles (rules only, no API calls)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write       # Required for GH Pages
  id-token: write    # Required for GH Pages

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Re-categorize all articles
        if: inputs.recategorize
        run: python categorize.py --no-verify

      - run: python monitor.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL:  ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY : ${{ secrets.GEMINI_API_KEY  }}
          VERIFIER_MODEL: ${{ vars.VERIFIER_MODEL }}
          VERIFIER_MAX_TOKENS: ${{ vars.VERIFIER_MAX_TOKENS }}
          VERIFIER_MIN_INTERVAL: ${{ vars.VERIFIER_MIN_INTERVAL }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update news data and index"
          file_pattern: 'seen_data.json index.html'
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000  # Increase timeout to 10 minutes
