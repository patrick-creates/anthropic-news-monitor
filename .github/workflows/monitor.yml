name: Anthropic News Monitor

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      recategorize:
        description: 'Re-apply category rules to all articles (rules only, no API calls)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write       # Required for GH Pages
  id-token: write    # Required for GH Pages

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Fails once the CI Python is end-of-life; an unreachable endoflife.date only warns so CI does not depend on it.
      - name: Check Python end-of-life
        run: |
          python - <<'EOF'
          import datetime, json, sys, urllib.request
          v = f"{sys.version_info.major}.{sys.version_info.minor}"
          try:
              with urllib.request.urlopen(f"https://endoflife.date/api/python/{v}.json", timeout=10) as r:
                  eol = json.load(r)["eol"]
          except Exception as exc:
              print(f"::warning::Could not check end-of-life of Python {v}: {exc}")
              sys.exit(0)
          if eol is not False and (eol is True or datetime.date.fromisoformat(eol) <= datetime.date.today()):
              sys.exit(f"::error::Python {v} reached end-of-life ({eol}); raise python-version in monitor.yml")
          print(f"Python {v} supported until {eol}")
          EOF

      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Re-categorize all articles
        if: inputs.recategorize
        run: python categorize.py --no-verify

      - run: python monitor.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL:  ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY : ${{ secrets.GEMINI_API_KEY  }}
          VERIFIER_MODEL: ${{ vars.VERIFIER_MODEL }}
          VERIFIER_MAX_TOKENS: ${{ vars.VERIFIER_MAX_TOKENS }}
          VERIFIER_MIN_INTERVAL: ${{ vars.VERIFIER_MIN_INTERVAL }}

      - name: Commit and push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update news data and index"
          file_pattern: 'seen_data.json index.html feed.xml'
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # Deploy even when monitor.py exits 1 (verifier outage): new articles are already committed
      - name: Upload Pages Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000  # Increase timeout to 10 minutes

      # Last so a finding never blocks the data commit or the deploy; requirements.txt uses version ranges, so audit what was actually installed rather than the file.
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip install pip-audit && python -m pip_audit
